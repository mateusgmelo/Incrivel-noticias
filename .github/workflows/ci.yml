name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Testes · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores fictícios: o build não acessa o banco (páginas dinâmicas),
      # mas a validação de ambiente exige formato válido.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-123456
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build de produção
        run: npm run build
